http_addr: ":8080"
database_url: "postgres://minicontrol:minicontrol@postgres:5432/minicontrol?sslmode=disable"
default_pool_size: 2
default_base_image: "minictl-tahoe-base"
worker_public_hostname: "minis-api.example.com"
browser_public_hostname: "minis.example.com"
# Generate with: openssl rand -hex 32
admin_token: "replace-with-admin-token"
enrollment_token: "replace-with-enrollment-token"
# Cloudflare Access for browser-facing APIs:
access_team_domain: "your-team.cloudflareaccess.com"
access_aud: "replace-with-cloudflare-access-audience"
access_allowed_email_domain: "example.com"
